usage=사용법: %s
usage.description=최신 comicread 릴리스 또는 지정한 버전을 설치합니다.
usage.examples=예시:
error.required_command=오류: 필요한 명령 '%s'이(가) 설치되어 있지 않습니다.
error.unknown_option=오류: 알 수 없는 옵션 '%s'.
error.option_value=오류: 옵션 '%s'에는 값이 필요합니다.
error.too_many_versions=오류: 버전 인수가 너무 많습니다.
error.interactive_input=오류: 대화형 입력에는 터미널이 필요합니다. 계속하려면 --yes를 사용하세요.
