status.extracting=%s 압축 해제 중...
status.installed=comicread %s이(가) %s에 설치되었습니다
status.restart=comicread를 사용하려면 터미널을 다시 시작하세요.
status.reload_shell=셸 설정을 다시 불러오세요: source %s
