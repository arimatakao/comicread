error.install_dir_writable=오류: '%s'에 쓸 수 없습니다.
hint.install_dir_writable=쓰기 가능한 디렉터리를 지정하세요. 예: INSTALL_DIR=$HOME/.local/bin bash install.sh
cancelled=설치가 취소되었습니다.
confirm.install=comicread %s을(를) %s에 설치할까요?
confirm.update=comicread가 이미 설치되어 있습니다(버전 %s). %s(으)로 업데이트할까요?
confirm.reinstall=comicread가 이미 설치되어 있습니다(버전 %s). %s을(를) 다시 설치할까요?
environment.configure=comicread를 설정할까요?
environment.saved.config=값이 %s에 저장됩니다.
environment.graphics=페이지를 어떻게 렌더링할까요? auto는 터미널 지원을 감지합니다.
environment.graphics.auto=auto - 터미널 지원을 자동으로 감지합니다
environment.graphics.ascii=ascii - 텍스트 아트 대체 방식, 모든 ANSI/UTF-8 터미널에서 작동합니다
environment.graphics.dots=dots - 점자 문자를 사용하는 텍스트 아트 대체 방식
environment.graphics.kitty=kitty - Kitty 그래픽 프로토콜을 통한 래스터 이미지
environment.graphics.sixel=sixel - Sixel 그래픽 프로토콜을 통한 래스터 이미지
environment.graphics.iterm2=iterm2 - iTerm2 인라인 이미지 프로토콜을 통한 래스터 이미지
environment.view=기본으로 열 페이지 레이아웃은 무엇인가요?
environment.view.book=book-view - 페이지를 왼쪽에서 오른쪽으로 쌍으로 표시
environment.view.right=right-view - 페이지를 오른쪽에서 왼쪽으로 쌍으로 표시
environment.view.circle=circle-view - 겹치는 페이지 쌍을 왼쪽에서 오른쪽으로 표시
environment.view.right_circle=right-circle-view - 겹치는 페이지 쌍을 오른쪽에서 왼쪽으로 표시
environment.language=어떤 인터페이스 언어를 사용할까요?
environment.languages=언어 | 값
environment.prerendered_next=다음 페이지를 몇 장 미리 준비할까요?
environment.prerendered_previous=이전 페이지를 몇 장 미리 준비할까요?
environment.prerendered_hint=예: 1 (기본값은 1페이지입니다).
environment.web_port=로컬 웹 리더에서 사용할 포트는 무엇인가요?
environment.web_port_hint=사용 가능한 임의의 포트를 사용하려면 0을 입력하세요(기본값: 55566).
value.port=0~65535 사이의 포트 번호
environment.directory=파일 선택기에서 기본으로 어떤 디렉터리를 열까요?
environment.directory_hint=예: /path/to/manga (현재 디렉터리를 사용하려면 비워 두세요).
value.non_negative_integer=0 이상의 정수
value.existing_directory=존재하는 디렉터리
prompt.select=  값 (건너뛰려면 비워 두세요):
environment.options=사용 가능한 값:
