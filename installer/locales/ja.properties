usage=使い方: %s
usage.description=最新の comicread リリース、または指定したバージョンをインストールします。
usage.examples=例:
error.required_command=エラー: 必要なコマンド '%s' がインストールされていません。
error.unknown_option=エラー: 不明なオプション '%s'。
error.option_value=エラー: オプション '%s' には値が必要です。
error.too_many_versions=エラー: バージョン引数が多すぎます。
error.interactive_input=エラー: 対話入力にはターミナルが必要です。続行するには --yes を使用してください。
error.unsupported_os=エラー: サポートされていない OS '%s'。
error.unsupported_arch=エラー: サポートされていないアーキテクチャ '%s'。
error.binary_missing=エラー: アーカイブ内に '%s' が見つかりません。
error.latest_version=エラー: 最新リリースのバージョンを取得できません。
error.zip_asset=エラー: アーキテクチャ '%s' 用の Windows zip アーカイブがリリース '%s' にありません。
error.install_dir_writable=エラー: '%s' に書き込めません。
hint.install_dir_writable=書き込み可能なディレクトリを指定してください。例: INSTALL_DIR=$HOME/.local/bin bash install.sh
cancelled=インストールを中止しました。
confirm.install=comicread %s を %s にインストールしますか？
confirm.update=comicread はすでにインストールされています（バージョン %s）。%s に更新しますか？
confirm.reinstall=comicread はすでにインストールされています（バージョン %s）。%s を再インストールしますか？
environment.configure=comicread の環境変数を設定しますか？
environment.saved.shell=値は %s に保存されます。
environment.saved.user=値はユーザー環境に保存されます。
environment.graphics=COMICREAD_GRAPHICS はページの描画方法を選びます。auto はターミナルの対応状況を検出します。
environment.view=COMICREAD_VIEW は既定のページレイアウトを選びます。単一ページ表示では空欄にしてください。
environment.language=COMICREAD_LANG はインターフェースの言語を選びます。既定値は en です。
prompt.value=  %s（%s。スキップするには空欄）：
