<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>comicread</title>
<link rel="stylesheet" href="/pico.min.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  #picker {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 100vh;
    gap: 1rem;
  }
  #picker-status { min-height: 1.5em; }
  #picker-status[data-kind="error"] { color: var(--pico-del-color); }

  #reader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--pico-background-color);
  }
  #stage {
    position: relative;
    perspective: 1800px;
    perspective-origin: center;
    flex: 1;
    min-height: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }
  #stage img {
    flex: 1 1 0;
    min-width: 0;
    max-width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .page-transition-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    pointer-events: none;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    will-change: transform, opacity, clip-path, filter;
    background: #000;
  }
  .page-transition-old { z-index: 3; }
  .page-transition-new { z-index: 2; }
  .page-transition-backdrop {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .page-transition-layer img {
    flex: 1 1 0;
    min-width: 0;
    max-width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .page-curl-shadow {
    position: absolute;
    top: -5%;
    left: 0;
    z-index: 4;
    width: 4rem;
    height: 110%;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }
  .page-turn-leaf {
    position: absolute;
    z-index: 4;
    transform-style: preserve-3d;
    will-change: transform, filter;
  }
  .page-turn-face {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: contain;
    backface-visibility: hidden;
  }
  .page-turn-back { transform: rotateY(180deg); }
  .page-turn-highlight {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0;
    backface-visibility: hidden;
    pointer-events: none;
  }
  #stage.vertical-scroll-view {
    display: block;
    overflow-x: hidden;
    overflow-y: auto;
  }
  #vertical-pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  #stage.vertical-scroll-view #vertical-pages img {
    flex: none;
    display: block;
    width: auto;
    max-width: 100%;
    height: auto;
    object-fit: initial;
  }
  #prefetch-progress, #reading-progress {
    display: block;
    width: 100%;
    height: .25rem;
    margin: 0;
    border: 0;
    border-radius: 0;
  }
  #controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: .5rem;
    margin: 0;
    padding: .5rem calc(.5rem + env(safe-area-inset-right)) calc(.5rem + env(safe-area-inset-bottom)) calc(.5rem + env(safe-area-inset-left));
    background: var(--pico-card-background-color);
    border-top: var(--pico-border-width) solid var(--pico-muted-border-color);
  }
  #controls button {
    min-width: 2.75rem;
    min-height: 2.75rem;
    padding: 0;
    margin: 0;
    font-size: 1.25rem;
    line-height: 1;
  }
  #controls button[disabled] { opacity: .35; }

  #show-controls-button {
    position: fixed;
    left: calc(.5rem + env(safe-area-inset-left));
    bottom: calc(.5rem + env(safe-area-inset-bottom));
    z-index: 1;
    min-width: 2.75rem;
    min-height: 2.75rem;
    padding: 0;
    margin: 0;
    font-size: 1.25rem;
    line-height: 1;
    border-radius: var(--pico-border-radius);
    background: var(--pico-card-background-color);
    border: var(--pico-border-width) solid var(--pico-muted-border-color);
    color: var(--pico-color);
    cursor: pointer;
  }

  #controls-left { grid-column: 1; justify-self: start; display: flex; align-items: center; gap: .5rem; min-width: 0; }
  #view-select, #animation-select {
    height: 2.75rem;
    max-width: 9rem;
    margin: 0;
    padding: 0 .5rem;
    font-size: .85rem;
  }

  #controls-right { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: .5rem; }
  #animation-select {
    max-width: 7.5rem;
  }
  #bg-color-input {
    width: 2.75rem;
    height: 2.75rem;
    padding: .25rem;
    margin: 0;
    border: var(--pico-border-width) solid var(--pico-muted-border-color);
    border-radius: var(--pico-border-radius);
    background: none;
    cursor: pointer;
  }
  #bg-color-input::-webkit-color-swatch-wrapper { padding: 0; }
  #bg-color-input::-webkit-color-swatch { border: none; border-radius: calc(var(--pico-border-radius) - .25rem); }
  #bg-color-input::-moz-color-swatch { border: none; border-radius: calc(var(--pico-border-radius) - .25rem); }

  #page-nav { grid-column: 2; justify-self: center; display: flex; align-items: center; gap: .5rem; }
  #page-count-button {
    min-width: 5.5rem;
    width: auto;
    padding: 0 .75rem;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
  }
  #page-goto-form { display: flex; margin: 0; }
  #page-goto-input {
    width: 5.5rem;
    height: 2.75rem;
    margin: 0;
    padding: 0 .5rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    #controls button { min-width: 2.5rem; min-height: 2.5rem; font-size: 1.1rem; }
    #page-count-button, #page-goto-input { min-width: 4.5rem; height: 2.5rem; }
    #bg-color-input { width: 2.5rem; height: 2.5rem; }
    #view-select, #animation-select { height: 2.5rem; max-width: 7rem; font-size: .75rem; }
    #show-controls-button { min-width: 2.5rem; min-height: 2.5rem; font-size: 1.1rem; }
  }

  @media (max-width: 700px) {
    #controls { grid-template-columns: 1fr auto; }
    #page-nav { grid-column: 1 / -1; grid-row: 1; }
    #controls-left { grid-column: 1; grid-row: 2; }
    #controls-right { grid-column: 2; grid-row: 2; }
    #view-select, #animation-select { max-width: 6rem; }
  }

</style>
</head>
<body>

<main id="picker" class="container">
  <hgroup>
    <h1>comicread</h1>
    <p>Open a CBZ, PDF, or EPUB comic to start reading.</p>
  </hgroup>
  <input type="file" id="file-input" accept=".cbz,.pdf,.epub" hidden>
  <button id="pick-button" type="button">Open file…</button>
  <p id="picker-status" role="status" aria-live="polite"></p>
</main>

<div id="reader" hidden>
  <figure id="stage">
    <img id="page-image-left" alt="">
    <img id="page-image-right" alt="" hidden>
    <div id="vertical-pages" hidden></div>
  </figure>

  <button id="show-controls-button" type="button" aria-label="Show controls" hidden>▴</button>

  <progress id="prefetch-progress" value="0" max="1" aria-label="Caching pages" hidden></progress>

  <nav id="controls" aria-label="Reader controls">
    <div id="controls-left">
      <button id="hide-controls-button" type="button" aria-label="Hide controls">▾</button>
      <button id="fullscreen-button" type="button" aria-label="Toggle fullscreen">⤢</button>
      <select id="view-select" aria-label="Page layout">
        <option value="single-page" title="Show one page at a time">Single page</option>
        <option value="vertical-scroll" title="Show every page in a vertical strip">Vertical scroll</option>
        <option value="book-view" title="Show page pairs from left to right">Pairs L→R</option>
        <option value="right-view" title="Show page pairs from right to left (manga order)">Pairs R→L</option>
        <option value="circle-view" title="Show overlapping page pairs from left to right">Overlap L→R</option>
        <option value="right-circle-view" title="Show overlapping page pairs from right to left (manga order)">Overlap R→L</option>
      </select>
      <button id="open-file-button" type="button" aria-label="Open a different file">📂</button>
    </div>

    <div id="page-nav">
      <button id="prev-button" type="button" aria-label="Previous page">‹</button>
      <button id="page-count-button" type="button" aria-label="Go to page">– / –</button>
      <form id="page-goto-form" hidden>
        <input id="page-goto-input" type="number" min="1" step="1" inputmode="numeric" aria-label="Page number">
      </form>
      <button id="next-button" type="button" aria-label="Next page">›</button>
    </div>

    <div id="controls-right">
      <select id="animation-select" aria-label="Page animation">
        <option value="none">No animation</option>
        <option value="slide">Slide</option>
        <option value="fade">Fade</option>
        <option value="turn">3D turn</option>
        <option value="curl">Page curl</option>
      </select>
      <input id="bg-color-input" type="color" value="#000000" aria-label="Page background color">
      <button id="theme-button" type="button" aria-label="Switch to light theme">☀️</button>
    </div>
  </nav>

  <progress id="reading-progress" value="0" max="1" aria-label="Reading progress"></progress>
</div>

<script src="/app.js"></script>
</body>
</html>
