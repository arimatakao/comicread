<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>comicread</title>
<link rel="stylesheet" href="/pico.min.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  #picker {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 100vh;
    gap: 1rem;
  }
  #picker-status { min-height: 1.5em; }
  #picker-status[data-kind="error"] { color: var(--pico-del-color); }

  #reader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--pico-background-color);
  }
  #stage {
    flex: 1;
    min-height: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #page-image {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  #controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: .5rem;
    margin: 0;
    padding: .5rem calc(.5rem + env(safe-area-inset-right)) calc(.5rem + env(safe-area-inset-bottom)) calc(.5rem + env(safe-area-inset-left));
    background: var(--pico-card-background-color);
    border-top: var(--pico-border-width) solid var(--pico-muted-border-color);
  }
  #controls button {
    min-width: 2.75rem;
    min-height: 2.75rem;
    padding: 0;
    margin: 0;
    font-size: 1.25rem;
    line-height: 1;
  }
  #controls button[disabled] { opacity: .35; }

  #fullscreen-button { grid-column: 1; justify-self: start; }
  #theme-button { grid-column: 3; justify-self: end; }

  #page-nav { grid-column: 2; justify-self: center; display: flex; align-items: center; gap: .5rem; }
  #page-count-button {
    min-width: 5.5rem;
    width: auto;
    padding: 0 .75rem;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
  }
  #page-goto-form { display: flex; margin: 0; }
  #page-goto-input {
    width: 5.5rem;
    height: 2.75rem;
    margin: 0;
    padding: 0 .5rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    #controls button { min-width: 2.5rem; min-height: 2.5rem; font-size: 1.1rem; }
    #page-count-button, #page-goto-input { min-width: 4.5rem; height: 2.5rem; }
  }
</style>
</head>
<body>

<main id="picker" class="container">
  <hgroup>
    <h1>comicread</h1>
    <p>Open a CBZ, PDF, or EPUB comic to start reading.</p>
  </hgroup>
  <input type="file" id="file-input" accept=".cbz,.pdf,.epub" hidden>
  <button id="pick-button" type="button">Open file…</button>
  <p id="picker-status" role="status" aria-live="polite"></p>
</main>

<div id="reader" hidden>
  <figure id="stage">
    <img id="page-image" alt="">
  </figure>
  <nav id="controls" aria-label="Reader controls">
    <button id="fullscreen-button" type="button" aria-label="Toggle fullscreen">⤢</button>

    <div id="page-nav">
      <button id="prev-button" type="button" aria-label="Previous page">‹</button>
      <button id="page-count-button" type="button" aria-label="Go to page">– / –</button>
      <form id="page-goto-form" hidden>
        <input id="page-goto-input" type="number" min="1" step="1" inputmode="numeric" aria-label="Page number">
      </form>
      <button id="next-button" type="button" aria-label="Next page">›</button>
    </div>

    <button id="theme-button" type="button" aria-label="Switch to light theme">☀️</button>
  </nav>
</div>

<script src="/app.js"></script>
</body>
</html>
